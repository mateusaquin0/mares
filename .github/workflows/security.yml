name: Security

# Pipeline de segurança: roda em push/PR para main e semanalmente (agenda).
# Três camadas complementares:
#   1. CodeQL   — SAST: vulnerabilidades e code smells no código JS/TS.
#   2. Dependências — npm audit: pacotes com CVEs conhecidos (Dependabot cuida das atualizações).
#   3. Secrets  — Gitleaks: credenciais/chaves acidentalmente commitadas.

on:
  # Roda a cada push em QUALQUER branch e em todo PR/merge para main.
  push:
  pull_request:
    branches: [main]
  schedule:
    # Segunda-feira 03:00 UTC — pega CVEs novos em deps que não mudaram.
    - cron: "0 3 * * 1"

# Cancela execuções antigas do mesmo ref quando um novo push chega.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-and-quality inclui, além de segurança, regras de qualidade (code smells).
          queries: security-and-quality

      - name: Analisar
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  dependencies:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Falha apenas em vulnerabilidades critical.
      #
      # O nível era `high` até 06/10/2026, quando o portão passou a ser insatisfazível e
      # travou todos os PRs do repositório. As 7 high restantes não têm saída viável:
      #   - tailwindcss (0.5.0 - 3.4.19) e chokidar (2.0.0 - 3.6.0, puxado por ele):
      #     sem versão corrigida na linha 3.x. O PR de migração para o tailwindcss 4
      #     resolve as duas, porque a major 4 está fora da faixa.
      #   - @next/eslint-plugin-next, braces, fast-glob e micromatch: só "corrigem"
      #     voltando o eslint-config-next para a major 14, o que é um downgrade.
      # Todas são devDependencies e nenhuma alcança o bundle de produção.
      #
      # As high de produção (axios, sharp, source-map-js, brace-expansion) foram corrigidas
      # no mesmo commit. Voltar para `high` assim que o tailwindcss 4 e o eslint-config-next
      # destravarem — o objetivo é um portão que possa passar, não um vermelho permanente.
      - name: npm audit (critical)
        run: npm audit --audit-level=critical

  secrets:
    name: Varredura de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo para o Gitleaks varrer todos os commits do PR/push.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
