name: CI

# Verificação de qualidade em cada push/PR (Fases 4 e 2 do docs/ROADMAP_TESTES.md).
# Job 1 (build-and-test): typecheck, lint, formatação e testes unitários (sem banco).
# Job 2 (integration): testes de integração contra um Postgres real (serviço do CI).
# E2E (Fase 3) entra num job próprio quando implementada.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      # Com cobertura: os thresholds do vitest.config.ts falham o job se a cobertura cair.
      - name: Testes unitários (com cobertura)
        run: npm run test:cov

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mares_test
        ports:
          - 5432:5432
        # Espera o banco ficar pronto antes dos steps.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mares_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mares_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      # As migrations assumem o ambiente Supabase (schema auth, roles anon/authenticated).
      # O shim cria esses objetos como stubs para que `migrate deploy` rode num Postgres puro.
      - name: Preparar schema Supabase (shim)
        run: psql "$DATABASE_URL" -f tests/integration/supabase-shim.sql

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Testes de integração
        run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mares_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mares_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mares_test
      # Chaves públicas do Supabase são dummy: o smoke E2E é da superfície pública,
      # que não faz round-trip ao Auth (sem cookie de sessão → sem chamada de rede).
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      # A validação de env (src/env.ts) exige a service role no build; o smoke público
      # nunca a usa, então um valor dummy basta para o `next build` não falhar.
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Preparar schema Supabase (shim)
        run: psql "$DATABASE_URL" -f tests/integration/supabase-shim.sql

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Instalar navegador (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (smoke público)
        run: npm run test:e2e
