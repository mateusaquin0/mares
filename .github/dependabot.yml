version: 2
updates:
  # Atualizações de dependências npm — agrupadas para reduzir ruído de PRs.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patches/minors não-quebrantes num único PR por semana.
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Majors de framework/infra são migrações deliberadas (breaking changes, às vezes
    # exigem mudança de config). Feitos na mão quando decidido — não como bump automático.
    # Segurança não é afetada: patches de CVE são minor/patch, continuam vindo.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - security

  # Mantém as próprias GitHub Actions (checkout, setup-node, codeql...) atualizadas.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # Todos os bumps de Actions num único PR por semana (evita 1 PR por action).
      github-actions:
        patterns:
          - "*"
    labels:
      - ci
